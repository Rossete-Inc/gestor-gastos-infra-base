version: "3"

# App AWS CDK (Go) do infra-base. Use pela raiz: `task infra:test` etc.
# Detalhes em infra/README.md. Nenhuma task aqui faz deploy.

vars:
  # CLI do CDK com versão fixa, via npx (não precisa de instalação global).
  CDK: npx --yes aws-cdk@2.1148.0

  # Raiz do repositório: módulo Go da Lambda do trigger (./cmd/post-confirmation).
  RAIZ: "{{.TASKFILE_DIR}}/.."

tasks:
  test:
    desc: Roda vet e os testes de assertion do CDK e da Lambda do trigger (não precisa de AWS nem de build)
    cmds:
      - go vet ./...
      - go test ./...
      - go -C "{{.RAIZ}}" vet ./...
      - go -C "{{.RAIZ}}" test ./...

  build:
    desc: Compila a Lambda do trigger Post Confirmation (linux/arm64) em dist/post-confirmation/bootstrap
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    cmds:
      # Mesmo comando do job de build do go-service.yml.
      - go -C "{{.RAIZ}}" build -tags lambda.norpc -trimpath -ldflags="-s -w" -o dist/post-confirmation/bootstrap ./cmd/post-confirmation

  synth:
    desc: Compila a Lambda e gera os templates de todas as stacks em cdk.out (exige BUDGET_EMAIL ou -c budgetEmail=...)
    deps: [build]
    cmds:
      - "{{.CDK}} synth --quiet {{.CLI_ARGS}}"

  synth:cicd:
    desc: Gera só o template da stack cicd (não precisa do e-mail do budget)
    cmds:
      - "{{.CDK}} synth gestor-gastos-cicd {{.CLI_ARGS}}"

  diff:
    desc: Compila a Lambda e mostra a diferença entre o código e a conta (só leitura, precisa de credenciais)
    deps: [build]
    cmds:
      - "{{.CDK}} diff {{.CLI_ARGS}}"
