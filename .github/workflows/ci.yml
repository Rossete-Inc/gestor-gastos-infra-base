# Esteira do próprio infra-base.
#
# Hoje:
#   - actionlint (com shellcheck) em todos os workflows, incluindo os reutilizáveis
#     go-service.yml e frontend.yml;
#   - checagem de "Validado localmente" no PR;
#   - Go: go mod tidy, gofmt, go vet e testes da Lambda do trigger (raiz) e dos testes
#     de assertion do CDK (infra/). Sem AWS.
#
# Deploy do infra-base: ainda manual (infra/README.md). Ainda não chama o go-service.yml porque:
#   - o go-service.yml roda qualidade e build na raiz e faz `cdk deploy --all`, o que inclui as
#     stacks da conta: a cicd (que cria as próprias roles da esteira) e a budget (que exige
#     BUDGET_EMAIL, variável que ainda não existe no GitHub);
#   - o primeiro deploy das stacks auth/events/api deve ser revisado à mão.
# Quando isso for resolvido, o job "infra" fica assim:
#
#   infra:
#     uses: ./.github/workflows/go-service.yml
#     permissions: { contents: read, id-token: write, pull-requests: write }
#     with:
#       lambdas: ./cmd/post-confirmation   # trigger do Cognito -> dist/post-confirmation/bootstrap
#       cdk-dir: infra
#       cdk-args: --context budgetEmail=${{ vars.BUDGET_EMAIL }}
#
# A stack cicd continua com deploy local, feito por um admin: é ela que cria as roles que a esteira assume.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Editar o corpo do PR não cancela a rodada do código (e vice-versa).
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'corpo' || 'codigo' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  validacao-local:
    name: Validado localmente
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checa o item "Validado localmente" no corpo do PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          corpo=$(printf '%s' "$PR_BODY" | tr -d '\r')
          marcado() { grep -Eiq "^[[:space:]]*[-*][[:space:]]*\[[xX]\][[:space:]]*$1" <<<"$corpo"; }
          if marcado 'Validado localmente'; then
            echo "Item \"Validado localmente\" marcado."
            exit 0
          fi
          # O template só exige o item para Funcionalidade e Correção.
          if ! marcado 'Funcionalidade' && ! marcado 'Corre' && { marcado 'Infraestrutura' || marcado 'Documenta'; }; then
            echo "::notice title=Validado localmente::PR só de infraestrutura/documentação: item dispensado."
            exit 0
          fi
          echo "::error title=Validado localmente::O corpo do PR precisa ter '- [x] Validado localmente'. Rode o roteiro da fatia com 'task local:up', marque o item no PR e edite o PR para reexecutar."
          exit 1

  actionlint:
    name: actionlint
    # Editar só o corpo do PR não muda os workflows.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Instala o actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
      - name: actionlint (com shellcheck do runner)
        run: |
          shellcheck --version | head -n 2
          ./actionlint -color

  go:
    name: Go (vet e testes)
    # Editar só o corpo do PR não muda o código.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: go mod tidy sem diferenças
        run: |
          go mod tidy
          (cd infra && go mod tidy)
          git diff --exit-code -- go.mod go.sum infra/go.mod infra/go.sum
      - name: gofmt
        run: |
          fora=$(gofmt -l cmd internal infra)
          if [ -n "$fora" ]; then
            echo "::error::Arquivos fora do gofmt:"; echo "$fora"; exit 1
          fi
      - name: Lambda do trigger (vet e testes)
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: CDK (vet e testes de assertion)
        working-directory: infra
        run: |
          go vet ./...
          go test -count=1 ./...
